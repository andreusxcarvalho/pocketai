[project]
name = "pocketai"
version = "0.1.0"
description = "Pocket AI recorder: Pi inbox server and laptop notes worker"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
# Laptop worker extras: speech-to-text and OCR.
worker = ["faster-whisper>=1.0", "pytesseract>=0.3.10"]
dev = ["pytest>=8"]

[project.scripts]
pocketai-inbox = "pocketai.inbox.server:main"
pocketai-worker = "pocketai.worker.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pocketai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
