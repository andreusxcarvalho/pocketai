; Pocket AI recorder firmware: one codebase, ten product versions.
;   pio run -e v02_status_screen -t upload && pio device monitor
; Uses the pioarduino platform for Arduino-ESP32 core 3.x (needed for ESP_I2S PDM and
; touchSleepWakeUpEnable on the S3).

[platformio]
default_envs = v10_full

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    zinggjm/GxEPD2@^1.6.4
    bblanchon/ArduinoJson@^7.2.0

[env:v01_voice_memo]
build_flags = ${env.build_flags} -DPOCKET_VERSION=1

[env:v02_status_screen]
build_flags = ${env.build_flags} -DPOCKET_VERSION=2

[env:v03_snapshots]
build_flags = ${env.build_flags} -DPOCKET_VERSION=3

[env:v04_light_aware]
build_flags = ${env.build_flags} -DPOCKET_VERSION=4

[env:v05_wifi_sync]
build_flags = ${env.build_flags} -DPOCKET_VERSION=5

[env:v06_compact_audio]
build_flags = ${env.build_flags} -DPOCKET_VERSION=6

[env:v07_auto_slides]
build_flags = ${env.build_flags} -DPOCKET_VERSION=7

; v08+ expose the SD card as a USB drive, which needs the TinyUSB stack.
[env:v08_usb_drive]
build_flags = ${env.build_flags} -DPOCKET_VERSION=8 -DARDUINO_USB_MODE=0

[env:v09_ble_companion]
build_flags = ${env.build_flags} -DPOCKET_VERSION=9 -DARDUINO_USB_MODE=0

[env:v10_full]
build_flags = ${env.build_flags} -DPOCKET_VERSION=10 -DARDUINO_USB_MODE=0

; Host-side unit tests for lib/pocket_core (no board needed): make -C test/host
